<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Centry logo: donut-chart C
    - Outer radius 21, inner radius 10, center 24,24
    - C opening on right side (~50° gap top-right, ~50° gap bottom-right)
    - Vertical gap at 12 o'clock separates top-right piece
    - Two horizontal white lines on the left
  -->

  <!-- Main C body (from ~35° clockwise to ~325°, i.e. the whole left + bottom + top-left) -->
  <!-- This is the large piece: from bottom-right, going clockwise through left, to top -->
  <path d="
    M 38 34
    A 21 21 0 1 1 25.5 3.1
    L 25.5 14
    A 10 10 0 1 0 31 31
    Z
  " fill="#1E6B4F"/>

  <!-- Small top-right piece (separated by vertical gap at top) -->
  <path d="
    M 27.5 3.3
    A 21 21 0 0 1 38 14
    L 31 17
    A 10 10 0 0 0 27.5 14.2
    Z
  " fill="#1E6B4F"/>

  <!-- Two horizontal white bars (graph/chart lines) -->
  <rect x="7" y="21.5" width="18" height="2.8" rx="1.4" fill="white"/>
  <rect x="7" y="26.5" width="12.5" height="2.8" rx="1.4" fill="white"/>
</svg>
